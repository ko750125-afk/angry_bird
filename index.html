<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#dc2626" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="스마트폰 명작 앵그리버드(Angry Birds) PWA 게임 - 물리 엔진과 실시간 사운드 합성 탑재" />
  <title>앵그리버드 PWA - Angry Birds Vibe Edition</title>

  <link rel="manifest" href="./manifest.json?v=10" />
  <link rel="icon" type="image/png" sizes="192x192" href="./public/icons/icon-192.png?v=10" />
  <link rel="icon" type="image/png" sizes="512x512" href="./public/icons/icon-512.png?v=10" />
  <link rel="apple-touch-icon" sizes="180x180" href="./public/icons/apple-touch-icon.png?v=10" />
  <link rel="apple-touch-icon" href="./public/icons/apple-touch-icon.png?v=10" />
  <link rel="shortcut icon" href="./public/icons/icon-192.png?v=10" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div class="app-wrapper">
    <!-- 상단 미니멀 HUD (화면 시야 극대화) -->
    <header class="hud-top">
      <div class="hud-brand">
        <div id="hudStageTitle" class="hud-stage-title">STAGE 1 : 초원 훈련장</div>
      </div>

      <div class="hud-stats">
        <div class="stat-item">
          <span class="stat-label">SCORE</span>
          <span id="hudScore" class="stat-value score">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">돼지</span>
          <span id="hudPigsLeft" class="stat-value pigs">3</span>
        </div>
      </div>

      <div class="hud-controls">
        <button id="btnRestart" class="hud-icon-btn" type="button" title="재시작 (R)">🔄</button>
        <button id="btnSettings" class="hud-icon-btn" type="button" title="설정 & 메뉴">⚙️</button>
      </div>
    </header>

    <!-- 메인 물리 캔버스 -->
    <canvas id="gameCanvas"></canvas>

    <!-- 하단 스킬 힌트 미니 플로팅 배너 -->
    <div id="hudSkillHint" class="hud-bottom">
      🐦 레드 — 공중 터치: 충격파 발산!
    </div>

    <!-- 설정 & 메뉴 모달 (각종 기능버튼 통합) -->
    <div id="settingsModal" class="modal-backdrop hidden">
      <div class="modal-box settings-modal-box">
        <h2 class="modal-title">⚙️ 게임 설정 & 메뉴</h2>
        <p class="modal-subtitle">사운드, 스테이지 선택, 전장 시야를 조작할 수 있습니다.</p>
        <div class="settings-list">
          <button id="btnSettingsStages" class="settings-action-btn" type="button">🗺️ 스테이지 선택</button>
          <button id="btnSettingsOverview" class="settings-action-btn" type="button">🔭 전장 전체 둘러보기 (ON/OFF)</button>
          <button id="btnSettingsRestart" class="settings-action-btn" type="button">🔄 현재 스테이지 재시작</button>
          <div class="settings-toggle-row">
            <button id="btnSettingsSfx" class="settings-toggle-btn" type="button">🔊 효과음 (SFX) ON</button>
            <button id="btnSettingsBgm" class="settings-toggle-btn" type="button">🎵 BGM ON</button>
          </div>
          <button id="btnSettingsInstall" class="settings-action-btn install" type="button" style="display: none;">📲 홈 화면에 앱 추가(PWA)</button>
        </div>
        <div class="modal-actions" style="margin-top: 18px;">
          <button id="btnCloseSettingsModal" class="action-btn next" type="button">확인</button>
        </div>
      </div>
    </div>

    <!-- 스테이지 클리어 / 실패 결과 모달 -->
    <div id="resultModal" class="modal-backdrop hidden">
      <div class="modal-box">
        <h2 id="resultTitle" class="modal-title win">🎉 STAGE CLEAR!</h2>
        <p id="resultSubtitle" class="modal-subtitle">모든 돼지를 소탕했습니다!</p>
        <div id="resultStars" class="modal-stars">⭐⭐⭐</div>
        <div id="resultScore" class="modal-score">최종 점수: 25,000점</div>
        <div class="modal-actions">
          <button id="btnModalRetry" class="action-btn retry" type="button">🔄 다시 하기</button>
          <button id="btnModalNext" class="action-btn next" type="button">➡️ 다음 스테이지</button>
        </div>
      </div>
    </div>

    <!-- 스테이지 선택 모달 -->
    <div id="stageModal" class="modal-backdrop hidden">
      <div class="modal-box">
        <h2 class="modal-title win">🗺️ 스테이지 선택</h2>
        <p class="modal-subtitle">도전할 스테이지를 선택하세요 (총 6대 테마 스테이지 & 고유 물리 기믹)</p>
        <div id="stageGrid" class="stage-grid"></div>
        <div class="modal-actions">
          <button id="btnCloseStageModal" class="action-btn retry" type="button">닫기</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Matter.js 물리 엔진 로컬 번들 (오프라인 완벽 지원) -->
  <script src="./public/vendor/matter.min.js"></script>
  <!-- 사운드 신디사이저, 레벨 데이터, 메인 게임 로직 -->
  <script src="./src/sound.js"></script>
  <script src="./src/levels.js"></script>
  <script src="./src/game.js"></script>

  <!-- PWA 서비스 워커 등록 및 설치 프롬프트 핸들러 -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    let deferredPrompt = null;
    const installBtn = document.getElementById('btnSettingsInstall');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (installBtn) installBtn.style.display = 'block';
    });

    if (installBtn) {
      installBtn.addEventListener('click', async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        installBtn.style.display = 'none';
      });
    }
  </script>
</body>
</html>
