<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <radialGradient id="birdGrad" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff5e62" />
      <stop offset="65%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </radialGradient>
  </defs>
  <!-- App Icon Rounded Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <circle cx="256" cy="490" r="240" fill="#4ade80" opacity="0.85" />
  <!-- Tail Feathers -->
  <path d="M90 250 L42 220 L55 245 L35 260 L60 272 L48 292 L95 280 Z" fill="#1e293b" />
  <!-- Top Crest Feathers -->
  <path d="M235 98 C215 55, 265 48, 275 95 C295 55, 330 70, 295 112 Z" fill="#dc2626" stroke="#7f1d1d" stroke-width="6" />
  <!-- Main Red Bird Body -->
  <circle cx="265" cy="275" r="155" fill="url(#birdGrad)" stroke="#7f1d1d" stroke-width="10" />
  <!-- White Belly -->
  <path d="M155 365 Q265 295 375 365 A155 155 0 0 1 155 365 Z" fill="#fef3c7" />
  <!-- Dark Red Spots -->
  <circle cx="170" cy="260" r="16" fill="#991b1b" opacity="0.6" />
  <circle cx="145" cy="295" r="11" fill="#991b1b" opacity="0.6" />
  <!-- Eyes -->
  <circle cx="250" cy="245" r="36" fill="#ffffff" stroke="#1e293b" stroke-width="6" />
  <circle cx="322" cy="245" r="36" fill="#ffffff" stroke="#1e293b" stroke-width="6" />
  <circle cx="260" cy="248" r="13" fill="#0f172a" />
  <circle cx="314" cy="248" r="13" fill="#0f172a" />
  <circle cx="256" cy="243" r="4" fill="#ffffff" />
  <circle cx="310" cy="243" r="4" fill="#ffffff" />
  <!-- Angry Eyebrows -->
  <polygon points="195,190 288,225 284,244 188,212" fill="#0f172a" />
  <polygon points="375,190 284,225 288,244 382,212" fill="#0f172a" />
  <!-- Yellow Beak -->
  <polygon points="245,278 345,288 282,252" fill="#fbbf24" stroke="#78350f" stroke-width="6" stroke-linejoin="round" />
  <polygon points="252,282 332,288 286,318" fill="#f59e0b" stroke="#78350f" stroke-width="6" stroke-linejoin="round" />
</svg>
